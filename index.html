<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; background: #fff; color: #000; margin: 0; }
        h1 { font-size: 20px; margin-top: 0; margin-bottom: 16px; }
        .card { padding: 12px; margin-bottom: 10px; border-radius: 10px; background: #f0f0f0; cursor: pointer; transition: opacity 0.2s; border: 1px solid #e0e0e0; }
        .card:active { opacity: 0.7; }
        .meta { font-size: 13px; color: #666; margin-top: 4px; }
        .back-btn { margin-bottom: 16px; padding: 10px 16px; border: none; border-radius: 8px; background: #2481cc; color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; }
        .hidden { display: none !important; }
        .empty { text-align: center; color: #888; margin-top: 40px; }
        .error { color: #e53935; padding: 12px; background: #ffebee; border-radius: 8px; margin-bottom: 10px; word-break: break-word; }
    </style>
</head>
<body>
    <div id="main-view">
        <div id="loading" class="empty">Загрузка данных с GitHub...</div>
        <div id="error" class="error hidden"></div>
        
        <div id="users-view" class="hidden">
            <h1>👤 Пользователи</h1>
            <div id="users-list"></div>
        </div>
        
        <div id="chats-view" class="hidden">
            <button class="back-btn" onclick="showUsers()">← Назад</button>
            <h1 id="chats-title">💬 Чаты</h1>
            <div id="chats-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- ВАШИ ДАННЫЕ ---
        const GITHUB_USER = "forumkero-hue";
        const GITHUB_REPO = "br-money-helper";
        const BRANCH = "main"; 
        
        // Используем jsDelivr (быстрый CDN, который не блокирует запросы и не кэширует так сильно, как raw)
        const USERS_URL = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${BRANCH}/api/users.json?t=${Date.now()}`;
        const SAVED_URL = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${BRANCH}/api/saved.json?t=${Date.now()}`;

        let globalSavedData = {};

        async function fetchData() {
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("error").classList.add("hidden");
            try {
                // Загружаем users.json
                const uRes = await fetch(USERS_URL);
                if (!uRes.ok) throw new Error(`Не удалось загрузить users.json (Код: ${uRes.status}).`);
                const usersData = await uRes.json();

                // Загружаем saved.json
                const sRes = await fetch(SAVED_URL);
                if (!sRes.ok) throw new Error(`Не удалось загрузить saved.json (Код: ${sRes.status}).`);
                globalSavedData = await sRes.json();

                renderUsers(usersData);
            } catch (e) {
                showError(e.message);
            } finally {
                document.getElementById("loading").classList.add("hidden");
            }
        }

        function renderUsers(users) {
            document.getElementById("users-view").classList.remove("hidden");
            document.getElementById("chats-view").classList.add("hidden");
            
            const list = document.getElementById("users-list");
            list.innerHTML = "";
            
            const keys = Object.keys(users);
            if (keys.length === 0) {
                list.innerHTML = "<div class='empty'>Нет подключённых пользователей.<br>Отправьте сообщение в Business-чат, чтобы бот обновил базу.</div>";
                return;
            }
            
            for (const conn_id of keys) {
                const u = users[conn_id];
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <strong>ID: ${u.user_id}</strong>
                    <div class="meta">Connection: ${conn_id.slice(0, 15)}...</div>
                `;
                div.onclick = () => renderChats(conn_id, u.user_id);
                list.appendChild(div);
            }
        }

        function renderChats(connId, userId) {
            document.getElementById("users-view").classList.add("hidden");
            document.getElementById("chats-view").classList.remove("hidden");
            document.getElementById("chats-title").textContent = `💬 Чаты (ID: ${userId})`;
            
            const list = document.getElementById("chats-list");
            list.innerHTML = "";
            
            const chats = {};
            const prefix = `b:${connId}:`;
            
            for (const [key, rec] of Object.entries(globalSavedData)) {
                if (!key.startsWith(prefix)) continue;
                const parts = key.split(":");
                if (parts.length < 4) continue;
                
                const chat_id = parts[2];
                const chat_title = rec.chat_title || `Chat ${chat_id}`;
                
                if (!chats[chat_id]) {
                    chats[chat_id] = { id: chat_id, title: chat_title, count: 0, last_ts: 0 };
                }
                chats[chat_id].count++;
                chats[chat_id].last_ts = Math.max(chats[chat_id].last_ts, rec.ts || 0);
            }
            
            const sortedChats = Object.values(chats).sort((a, b) => b.last_ts - a.last_ts);
            
            if (sortedChats.length === 0) {
                list.innerHTML = "<div class='empty'>Сообщений пока не было</div>";
                return;
            }
            
            for (const c of sortedChats) {
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <strong>${escapeHtml(c.title)}</strong>
                    <div class="meta">ID: ${c.id} · Сообщений: ${c.count}</div>
                `;
                list.appendChild(div);
            }
        }

        function showError(msg) {
            const el = document.getElementById("error");
            el.textContent = "Ошибка: " + msg;
            el.classList.remove("hidden");
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchData();
    </script>
</body>
</html>
