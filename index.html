<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; background: #ffffff; color: #000000; margin: 0; }
        h1 { font-size: 20px; margin-top: 0; margin-bottom: 16px; }
        .card { padding: 12px; margin-bottom: 10px; border-radius: 10px; background: #f0f0f0; cursor: pointer; transition: opacity 0.2s; border: 1px solid #e0e0e0; }
        .card:active { opacity: 0.7; }
        .meta { font-size: 13px; color: #666; margin-top: 4px; }
        .back-btn { margin-bottom: 16px; padding: 10px 16px; border: none; border-radius: 8px; background: #2481cc; color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; }
        .hidden { display: none !important; }
        .error { color: #e53935; padding: 12px; background: #ffebee; border-radius: 8px; margin-bottom: 10px; }
        .empty { text-align: center; color: #888; margin-top: 40px; }
        
        .login-box { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin: 50px auto; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        input:focus { border-color: #2481cc; }
    </style>
</head>
<body>
    <div id="login-view">
        <h1 style="text-align:center;">🔐 Вход в панель</h1>
        <div class="login-box">
            <input type="password" id="password" placeholder="Введите пароль" />
            <button class="back-btn" onclick="login()">Войти</button>
            <div id="login-error" class="error hidden"></div>
        </div>
    </div>

    <div id="main-view" class="hidden">
        <div id="loading" class="empty hidden">Загрузка...</div>
        <div id="error" class="error hidden"></div>
        
        <div id="users-view" class="hidden">
            <h1>👤 Пользователи</h1>
            <div id="users-list"></div>
        </div>
        
        <div id="chats-view" class="hidden">
            <button class="back-btn" onclick="showUsers()">← Назад</button>
            <h1 id="chats-title">💬 Чаты</h1>
            <div id="chats-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let AUTH_TOKEN = "";

        async function login() {
            const pass = document.getElementById("password").value;
            const errBox = document.getElementById("login-error");
            
            try {
                const formData = new URLSearchParams();
                formData.append("password", pass);
                
                const res = await fetch("/webapp/api/login", { method: "POST", body: formData });
                const data = await res.json();
                
                if (data.ok) {
                    AUTH_TOKEN = data.token;
                    document.getElementById("login-view").classList.add("hidden");
                    document.getElementById("main-view").classList.remove("hidden");
                    showUsers();
                } else {
                    errBox.textContent = data.err;
                    errBox.classList.remove("hidden");
                }
            } catch (e) {
                errBox.textContent = "Ошибка сети: " + e.message;
                errBox.classList.remove("hidden");
            }
        }

        async function apiCall(path, body = {}) {
            const formData = new URLSearchParams();
            formData.append("token", AUTH_TOKEN);
            for (const [k, v] of Object.entries(body)) formData.append(k, v);
            
            const res = await fetch(path, { method: "POST", body: formData });
            const data = await res.json();
            if (!data.ok) throw new Error(data.err || "Ошибка API");
            return data;
        }

        async function showUsers() {
            document.getElementById("users-view").classList.remove("hidden");
            document.getElementById("chats-view").classList.add("hidden");
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("error").classList.add("hidden");
            
            try {
                const data = await apiCall("/webapp/api/users");
                const list = document.getElementById("users-list");
                list.innerHTML = "";
                
                if (data.users.length === 0) {
                    list.innerHTML = "<div class='empty'>Нет подключённых пользователей</div>";
                    return;
                }
                
                for (const u of data.users) {
                    const div = document.createElement("div");
                    div.className = "card";
                    div.innerHTML = `
                        <strong>ID: ${u.user_id}</strong>
                        <div class="meta">Business Connection: ${u.connection_id.slice(0, 15)}...</div>
                    `;
                    div.onclick = () => showChats(u.connection_id, u.user_id);
                    list.appendChild(div);
                }
            } catch (e) {
                showError(e.message);
            } finally {
                document.getElementById("loading").classList.add("hidden");
            }
        }

        async function showChats(connId, userId) {
            document.getElementById("users-view").classList.add("hidden");
            document.getElementById("chats-view").classList.remove("hidden");
            document.getElementById("chats-title").textContent = `💬 Чаты пользователя ${userId}`;
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("error").classList.add("hidden");
            
            try {
                const data = await apiCall("/webapp/api/chats", { connection_id: connId });
                const list = document.getElementById("chats-list");
                list.innerHTML = "";
                
                if (data.chats.length === 0) {
                    list.innerHTML = "<div class='empty'>Сообщений пока не было</div>";
                    return;
                }
                
                for (const c of data.chats) {
                    const div = document.createElement("div");
                    div.className = "card";
                    div.innerHTML = `
                        <strong>${escapeHtml(c.chat_title)}</strong>
                        <div class="meta">ID: ${c.chat_id} · Сообщений: ${c.message_count}</div>
                    `;
                    list.appendChild(div);
                }
            } catch (e) {
                showError(e.message);
            } finally {
                document.getElementById("loading").classList.add("hidden");
            }
        }

        function showError(msg) {
            const el = document.getElementById("error");
            el.textContent = "Ошибка: " + msg;
            el.classList.remove("hidden");
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
